version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # eslint-config-next 16.x traz plugins que ainda não suportam ESLint 10.
      # Remover quando o Next publicar um eslint-config-next compatível.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 é uma major grande; avaliar em PR manual.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"