name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    # Postgres descartável para os testes de integração (RLS, CHECKs,
    # triggers). Não é o Supabase: scripts/ci/supabase-stub.sql imita o
    # mínimo que as migrations e os testes usam.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flomo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Usa a versão fixada em "packageManager" no package.json (pnpm@10.34.6)
      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Schema do Drizzle sem migration gerada, ou migrations inconsistentes.
      # Não conecta no banco: a URL só satisfaz o drizzle.config.ts.
      - name: Migrations em dia com o schema
        env:
          DATABASE_URL_MIGRATIONS: postgres://ci:ci@localhost:5432/ci
        run: |
          pnpm exec drizzle-kit check
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::O schema mudou sem migration. Rode pnpm db:generate e commite a pasta drizzle/."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Testes de integração (Postgres do CI)
        env:
          PGPASSWORD: postgres
          DATABASE_URL_MIGRATIONS: postgres://postgres:postgres@localhost:5432/flomo_ci
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/flomo_ci
        run: |
          psql -h localhost -U postgres -d flomo_ci -v ON_ERROR_STOP=1 -q -f scripts/ci/supabase-stub.sql
          pnpm db:migrate
          pnpm test:integration

      - run: pnpm build

  # E2E do fluxo do spike (e2e/README.md): Supabase local (Postgres e Auth),
  # TMDB falso e o build do app. Sem segredo nem rede externa além do Docker.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      TMDB_READ_ACCESS_TOKEN: e2e-tmdb-falso
      TMDB_BASE_URL: http://localhost:3999/3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Supabase local
        run: supabase start

      # Chaves e URLs do Supabase local (valores de desenvolvimento, públicos).
      - name: Variáveis do Supabase local
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "DATABASE_URL=$DB_URL"
            echo "DATABASE_URL_MIGRATIONS=$DB_URL"
          } >> "$GITHUB_ENV"

      - run: pnpm db:migrate

      # O app usa o usuário restrito, como em produção (migration 0019). A
      # senha só vale neste Supabase local, descartado ao fim do job.
      - name: App com o usuário flomo_app
        run: |
          psql "$DATABASE_URL_MIGRATIONS" -v ON_ERROR_STOP=1 -q -c "alter role flomo_app with password 'flomo-e2e'"
          url="${DATABASE_URL_MIGRATIONS/postgres:postgres@/flomo_app:flomo-e2e@}"
          if [ "$url" = "$DATABASE_URL_MIGRATIONS" ]; then
            echo "::error::DB_URL do Supabase local mudou de formato; ajuste a troca de usuário."
            exit 1
          fi
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
